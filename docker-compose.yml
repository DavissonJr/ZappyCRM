services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsappcrmia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # WhatsApp não-oficial (Baileys) — self-hosted.
  # Docs: https://doc.evolution-api.com
  evolution-api:
    image: evoapicloud/evolution-api:latest
    environment:
      AUTHENTICATION_API_KEY: "CHANGE_ME"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://postgres:postgres@postgres:5432/evolution?schema=public"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/1"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances

  api:
    build:
      context: ./backend
      dockerfile: src/WhatsappCrmIA.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=whatsappcrmia;Username=postgres;Password=postgres"
      EvolutionApi__BaseUrl: "http://evolution-api:8080"
      EvolutionApi__ApiKey: "CHANGE_ME"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-CHANGE_ME}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-no-reply@zappycrm.com}"
      Smtp__FromName: "Zappy CRM"
      Cors__AllowedOrigin: "http://localhost:4200"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
  evolution_instances:
