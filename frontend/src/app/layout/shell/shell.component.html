<div class="shell">
  <!-- Barra superior só aparece no mobile -->
  <header class="mobile-topbar">
    <button class="hamburger-btn" (click)="toggleMobileMenu()" title="Abrir menu">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <div class="brand">Zappy<span>CRM</span></div>
    <a routerLink="/configuracoes" class="mobile-avatar">{{ (auth.currentUserName() || '?').charAt(0) }}</a>
  </header>

  @if (mobileMenuOpen()) {
    <div class="mobile-backdrop" (click)="toggleMobileMenu()"></div>
  }

  <aside class="sidebar" [class.open]="mobileMenuOpen()">
    <div class="brand desktop-only">Zappy<span>CRM</span></div>

    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path [attr.d]="item.icon" />
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }

      @if (auth.isPlatformAdmin()) {
        <div class="nav-divider"></div>
        <a routerLink="/admin" routerLinkActive="active" class="nav-item admin-item">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path d="M10 2 3 5v5c0 4.2 3 7.5 7 8 4-.5 7-3.8 7-8V5l-7-3Zm0 2.2 5 2.2v3.6c0 3.1-2.1 5.7-5 6.4-2.9-.7-5-3.3-5-6.4V6.4l5-2.2Z"/>
          </svg>
          <span>Admin</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/configuracoes" routerLinkActive="active" class="user-chip">
        <div class="avatar">{{ (auth.currentUserName() || '?').charAt(0) }}</div>
        <span>{{ auth.currentUserName() }}</span>
      </a>
      <button class="theme-btn" (click)="theme.toggle()" title="Trocar tema">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="4"/><path stroke-linecap="round" d="M10 1.5v2M10 16.5v2M3.5 10h-2M18.5 10h-2M5.4 5.4 4 4M16 16l-1.4-1.4M14.6 5.4 16 4M4 16l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M17 10.5A7.5 7.5 0 0 1 9.5 3 7.5 7.5 0 1 0 17 10.5Z"/></svg>
        }
      </button>
      <button class="logout-btn" (click)="logout()" title="Sair">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path d="M6 3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h5a1 1 0 1 0 0-2H7V5h4a1 1 0 1 0 0-2H6Zm8.293 4.293a1 1 0 0 1 1.414 0L18.414 10l-2.707 2.707a1 1 0 0 1-1.414-1.414L15.586 10H9a1 1 0 1 1 0-2h6.586l-1.293-1.293a1 1 0 0 1 0-1.414Z"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
